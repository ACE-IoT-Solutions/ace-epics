name: Nightly fuzz and performance
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - run: uv sync --locked --all-extras --group dev
      - name: Independent generated input budgets
        run: >-
          uv run pytest --no-cov
          tests/unit/values/test_properties.py
          tests/codecs/epics/test_reader.py
          tests/codecs/epics/test_writer.py
          tests/codecs/serdes/test_interchange.py
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - run: uv sync --locked --all-extras --group dev
      - run: uv run pytest --no-cov -m slow
