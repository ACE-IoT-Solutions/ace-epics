name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run pytest --cov-fail-under=90 --cov-report=xml --cov-report=json
      - name: Enforce overall and scoped coverage
        run: uv run python scripts/check_coverage.py coverage.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            coverage.json
      - run: uv run python scripts/gen_conformance.py
      - run: git diff --exit-code -- docs/site/reference/conformance.md
