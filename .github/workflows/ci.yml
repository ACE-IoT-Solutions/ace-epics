name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run pytest --ignore=tests/codecs/epics/test_performance.py --cov-fail-under=90 --cov-report=xml --cov-report=json
      - name: Enforce overall and scoped coverage
        run: uv run python scripts/check_coverage.py coverage.json
      - name: Enforce parser performance without coverage instrumentation
        run: uv run pytest tests/codecs/epics/test_performance.py --no-cov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            coverage.json
      - run: uv run python scripts/gen_conformance.py
      - run: git diff --exit-code -- docs/site/reference/conformance.md
